services:
  django:
    build:
      context: ./django 
    container_name: django_app 
    command: python manage.py runserver 0.0.0.0:8000 
    volumes:
      - ./django:/app 
    env_file:
      - .env 
    ports:
      - "8000:8000" 
    depends_on:
      - db 

  db:
    image: postgres:14.19-alpine3.21
    container_name: postgres_db 
    env_file:
      - .env 
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    ports:
      - "5433:5432" 


volumes:
  postgres_data: 